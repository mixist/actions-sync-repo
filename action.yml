name: 'Git Repo Sync'
description: 'Git Repo Sync enables you to synchronize code to other code management platforms, such as GitLab, Gitee, etc.'

branding:
  icon: upload-cloud
  color: gray-dark

inputs:
  target-url:
    description: 'Target Repo URL'
    required: true
  target-username:
    description: 'Target Repo Username'
    required: true
  target-token:
    description: 'Target Token'
    required: true
  target-force-push:
    description: 'Force push branches and tags'
    required: false
    default: 'false'
  mirror:
    description: 'Mirror all refs (branches + tags) and prune refs deleted on the source. Overrides target-force-push.'
    required: false
    default: 'false'
  only-on-version-change:
    description: 'Only sync when the version field in the version file changed'
    required: false
    default: 'false'
  version-file:
    description: 'Path to the JSON file whose version field is compared'
    required: false
    default: 'package.json'
  before-ref:
    description: 'Git SHA before the push, used to read the previous version. Defaults to github.event.before'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - run: ${{ github.action_path }}/entrypoint.sh
      shell: bash
      env:
        INPUT_TARGET_URL: ${{ inputs.target-url }}
        INPUT_TARGET_USERNAME: ${{ inputs.target-username }}
        INPUT_TARGET_TOKEN: ${{ inputs.target-token }}
        INPUT_TARGET_FORCE_PUSH: ${{ inputs.target-force-push }}
        INPUT_MIRROR: ${{ inputs.mirror }}
        INPUT_ONLY_ON_VERSION_CHANGE: ${{ inputs.only-on-version-change }}
        INPUT_VERSION_FILE: ${{ inputs.version-file }}
        INPUT_BEFORE_REF: ${{ inputs.before-ref || github.event.before }}